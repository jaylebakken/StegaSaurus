[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stegosaurus"
version = "0.1.0"
description = "Local audio provenance watermarking prototype."
requires-python = ">=3.11"
dependencies = [
    "reedsolo>=1.7,<2",
]

[project.optional-dependencies]
audio = [
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
]
test = ["pytest>=8"]
aws-alpha = [
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "src/stegosaurus/audio/tests/application",
    "src/stegosaurus/audio/tests/experiment_regressions",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stegosaurus*", "saurus_app*", "saurus_gateway*", "saurus_registry*", "saurus_discovery*", "saurus_infra*", "saurus_pilot*", "saurus_style*"]

[tool.setuptools.package-data]
saurus_style = ["*.json", "*.css", "*.html", "assets/*.svg", "assets/*.png"]
