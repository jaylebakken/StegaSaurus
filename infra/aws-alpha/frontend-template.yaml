AWSTemplateFormatVersion: "2010-09-09"
Description: "Saurus alpha static frontend hosting."
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  Owner:
    Type: String
    Description: "Human owner for alpha frontend resources."
  HostedZoneId:
    Type: String
    Description: "Route 53 public hosted zone ID for the frontend domain."
  ApexDomainName:
    Type: String
    Default: saurus-audio.com
    Description: "Apex domain served by CloudFront."
  WwwDomainName:
    Type: String
    Default: www.saurus-audio.com
    Description: "www domain served by CloudFront."
  CertificateArn:
    Type: String
    Description: "us-east-1 ACM certificate ARN for the CloudFront aliases."

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "Stores static Saurus alpha frontend assets behind CloudFront."
        must:
          - "Remain private; CloudFront OAC is the only read path."
          - "Retain on stack deletion so deployed assets are not accidentally destroyed."
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: saurus
        - Key: env
          Value: alpha
        - Key: owner
          Value: !Ref Owner

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: "Lets CloudFront sign S3 origin requests without making the bucket public."
        must:
          - "Use SigV4 signing for S3 origin access."
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: "Saurus alpha frontend S3 origin access."
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: "Serves the Saurus alpha frontend over HTTPS at the public product domains."
        must:
          - "Redirect viewers to HTTPS."
          - "Use the us-east-1 ACM certificate supplied by parameter."
          - "Attach managed security response headers."
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref ApexDomainName
          - !Ref WwwDomainName
        Comment: "Saurus alpha frontend"
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: project
          Value: saurus
        - Key: env
          Value: alpha
        - Key: owner
          Value: !Ref Owner

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "Restricts private frontend asset reads to the expected CloudFront distribution."
        must:
          - "Deny non-TLS requests."
          - "Allow reads only from the CloudFront distribution in this account."
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${FrontendBucket.Arn}"
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  ApexAliasRecord:
    Type: AWS::Route53::RecordSet
    Metadata:
      com.aws.cloudformation.Context:
        why: "Routes the apex Saurus domain to the CloudFront frontend."
        must:
          - "Alias to CloudFront's global hosted zone ID."
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApexDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasRecord:
    Type: AWS::Route53::RecordSet
    Metadata:
      com.aws.cloudformation.Context:
        why: "Routes the www Saurus domain to the CloudFront frontend."
        must:
          - "Alias to CloudFront's global hosted zone ID."
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendDistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  ApexUrl:
    Value: !Sub "https://${ApexDomainName}"
  WwwUrl:
    Value: !Sub "https://${WwwDomainName}"
